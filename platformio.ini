; GM MIDI Player — M5Stack Cardputer ADV
; pio run -e cardputer_adv -t upload

[platformio]
default_envs = cardputer_adv

; ─── Cardputer ADV (con ES8311) ───────────────────────────────────────────────
[env:cardputer_adv]
platform  = espressif32@6.7.0
board     = m5stack-stamps3
framework = arduino

upload_speed    = 1500000
upload_protocol = esptool
upload_port     = COM4
monitor_speed   = 115200
monitor_port    = COM4
monitor_encoding = utf-8
monitor_filters = esp32_exception_decoder

board_build.mcu          = esp32s3
board_build.f_cpu        = 240000000L
board_build.flash_mode   = dio
board_build.flash_size   = 8MB
board_build.partitions   = huge_app.csv
board_upload.flash_size  = 8MB

build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=8192
    -DBOARD_HAS_PSRAM=0
    -O2

lib_deps =
    m5stack/M5Cardputer @ ^1.0.2

lib_extra_dirs = lib

; ─── Cardputer v1.1 (senza ES8311, opzione audio da 1 a 3) ───────────────────
[env:cardputer_v11]
extends    = env:cardputer_adv
build_flags =
    ${env:cardputer_adv.build_flags}
    -DCARDPUTER_V11
